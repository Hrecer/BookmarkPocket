<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>BookmarkPocket 书签管理器</title>
<script src="theme-boot.js"></script>
<link rel="stylesheet" href="manager.css">
</head>
<body>
<div class="shell">
  <header class="titlebar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span class="brandname">BookmarkPocket</span>
    </div>
    <nav class="nav" id="nav">
      <span class="nav-ind"></span>
      <button class="navitem active" data-view="browse" type="button">书签</button>
      <button class="navitem" data-view="search" type="button">搜索</button>
      <button class="navitem" data-view="settings" type="button">设置</button>
    </nav>
    <div class="titlebar-right">
      <button id="btnTheme" class="iconbtn" type="button" title="外观：跟随系统" aria-label="外观">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg>
      </button>
      <div class="bridgebox" id="bridgebox" title="桥状态">
        <span class="dot" id="bri"></span>
        <span class="bridgetext" id="britext">检测中…</span>
      </div>
    </div>
  </header>

  <div class="pagerow navrow">
    <div class="navbtns">
      <button id="btnBack" class="iconbtn" type="button" title="后退 (Alt+← / Backspace)" aria-label="后退">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.4 5.2 8l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnFwd" class="iconbtn" type="button" title="前进 (Alt+→)" aria-label="前进">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 3.4 9.8 8l-3.6 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnUp" class="iconbtn" type="button" title="上一级 (Alt+↑)" aria-label="上一级">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.6V4.2M4.2 7.6 8 3.8l3.8 3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="crumbsbar"><div class="crumbs" id="crumbs"></div></div>
  </div>

  <div class="pagerow actionrow">
    <div class="actions">
      <button id="btnNewFolder" class="tbtn" type="button" title="新建文件夹 (Ctrl+Shift+N)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.2c0-.8.6-1.4 1.4-1.4h3l1.3 1.6h4.9c.8 0 1.4.6 1.4 1.4v6.6c0 .8-.6 1.4-1.4 1.4H3.4c-.8 0-1.4-.6-1.4-1.4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.4v3.6M6.2 9.2h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        新建文件夹</button>
      <button id="btnNewLink" class="tbtn" type="button" title="新建书签">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a3 3 0 0 0 4.2 0l2.2-2.2a3 3 0 0 0-4.2-4.2L7.6 4.2M9.4 6.6a3 3 0 0 0-4.2 0L3 8.8a3 3 0 0 0 4.2 4.2l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        新建书签</button>
      <button id="btnRename" class="tbtn" type="button" title="重命名 (F2)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 11.8.3-2.2 7-7a1.1 1.1 0 0 1 1.6 0l1.5 1.5a1.1 1.1 0 0 1 0 1.6l-7 7-2.2.3zM9.6 3.3l3.1 3.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        重命名</button>
      <button id="btnDelete" class="tbtn" type="button" title="删除选中（文件夹仅此处可删）">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.3h10.8M6.4 2.6h3.2M4.1 4.3l.6 9a1.2 1.2 0 0 0 1.2 1.1h4.2a1.2 1.2 0 0 0 1.2-1.1l.6-9M6.6 6.9v4.7M9.4 6.9v4.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        删除</button>
    </div>
    <div class="viewseg" role="group" aria-label="视图布局">
      <span class="viewseg-ind" aria-hidden="true"></span>
      <button id="btnViewList" class="iconbtn" type="button" title="列表视图" aria-label="列表视图">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.2h10.8M2.6 8h10.8M2.6 11.8h10.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button id="btnViewGrid" class="iconbtn" type="button" title="卡片视图" aria-label="卡片视图">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="2.4" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.4" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2.4" y="9" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>

  <div class="panes" id="panes">
    <aside class="tree-panel">
      <div class="panel-head">导航</div>
      <div class="tree" id="tree">
        <div id="tspacer"></div>
        <div id="trows"></div>
      </div>
    </aside>

    <section class="list-card">
      <div class="list-head" id="listhead">
        <button class="col col-name" data-sort="title" type="button">名称<span class="sortind"></span></button>
        <div class="col col-url">网址</div>
        <button class="col col-date" data-sort="dateAdded" type="button">添加时间<span class="sortind"></span></button>
      </div>
      <div class="list" id="list">
        <div id="spacer"></div>
        <div id="rows"></div>
        <div id="crows"></div>
        <div id="empty" class="empty" hidden>
          <div class="empty-badge">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 6h22v36l-11-7.4L13 42z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
          </div>
          <p class="empty-title" id="emptytitle">此文件夹为空</p>
          <p class="empty-desc" id="emptydesc">当前文件夹中没有书签</p>
        </div>
        <div id="busy" class="busy" hidden><div class="spin"></div></div>
      </div>
    </section>

    <div class="splitter" id="splitter" title="拖动调整宽度"></div>

    <aside class="details" id="details"></aside>
  </div>

  <section class="searchview" id="searchview" hidden>
    <div class="searchbar">
      <input id="q" type="text" placeholder="全库搜索：标题 / 网址 / 文件夹 / ID…" spellcheck="false" autocomplete="off">
      <button id="btnSearchGo" class="tbtn primary" type="button">搜索</button>
      <button id="btnQCancel" class="tbtn" type="button" title="清空搜索并取消选中">取消</button>
    </div>
    <div class="searchchips">
      <span class="chips-label">范围</span>
      <button class="qchip on" data-scope="title" type="button">标题</button>
      <button class="qchip on" data-scope="url" type="button">网址</button>
      <button class="qchip on" data-scope="path" type="button">位置</button>
      <div class="actions">
        <button id="btnJump" class="tbtn" type="button" title="跳到所在位置（恰选 1 项）" disabled>跳转</button>
        <button id="btnQDelete" class="tbtn danger" type="button" title="删除选中的书签（文件夹请回「浏览」页删除）" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.3h10.8M6.4 2.6h3.2M4.1 4.3l.6 9a1.2 1.2 0 0 0 1.2 1.1h4.2a1.2 1.2 0 0 0 1.2-1.1l.6-9M6.6 6.9v4.7M9.4 6.9v4.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          删除</button>
      </div>
      <div class="viewseg" role="group" aria-label="搜索结果视图布局">
        <span class="viewseg-ind" aria-hidden="true"></span>
        <button id="btnQViewList" class="iconbtn" type="button" title="列表视图" aria-label="列表视图">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.2h10.8M2.6 8h10.8M2.6 11.8h10.8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button id="btnQViewGrid" class="iconbtn" type="button" title="卡片视图" aria-label="卡片视图">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="2.4" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.4" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2.4" y="9" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="4.6" height="4.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="searchpanes">
      <section class="list-card">
        <div class="list-head">
          <div class="col col-name">名称</div>
          <div class="col col-url">网址</div>
          <div class="col col-date">位置</div>
        </div>
        <div class="list" id="qlist">
          <div id="qspacer"></div>
          <div id="qrows"></div>
          <div id="qcrows"></div>
          <div id="qempty" class="empty" hidden>
            <div class="empty-badge">
              <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="21" r="12" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="m30 30 8 8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
            </div>
            <p class="empty-title" id="qemptytitle">输入关键词后回车搜索</p>
            <p class="empty-desc" id="qemptydesc">范围：标题 / 网址 / 所在位置</p>
          </div>
        </div>
      </section>
      <div class="splitter" id="splitter2" title="拖动调整宽度"></div>
      <aside class="details" id="details2"></aside>
    </div>
  </section>

  <section class="settingsview" id="settingsview" hidden>
    <div class="card spanel">
      <div class="dlabel">外观</div>
      <div class="srow segs">
        <button class="tbtn" data-theme-set="auto" type="button">跟随系统</button>
        <button class="tbtn" data-theme-set="light" type="button">浅色</button>
        <button class="tbtn" data-theme-set="dark" type="button">深色</button>
      </div>
      <p class="snote">默认跟随系统的浅色 / 深色设置；也可以在这里固定成某一种。右上角图标是同一个开关。</p>
    </div>
    <div class="card spanel">
      <div class="dlabel">桥（连接 Agent 中枢）</div>
      <label class="field">中枢端口<input id="cfgPort" type="number" min="1" max="65535" placeholder="19127"></label>
      <label class="field">访问令牌（mcp/config.json 里的 token）<input id="cfgToken" type="text" placeholder="粘贴令牌" spellcheck="false"></label>
      <div class="srow">
        <button id="btnCfgPair" class="tbtn primary" type="button">一键配对</button>
        <button id="btnCfgSave" class="tbtn" type="button">保存并重连</button>
        <button id="btnCfgReconnect" class="tbtn" type="button">仅重连</button>
        <span id="cfgStatus" class="dim"></span>
      </div>
    </div>
    <div class="card spanel">
      <div class="dlabel">关于</div>
      <div class="irow"><span class="iico"></span><span class="ilabel">扩展 ID</span><span class="ivalue mono" id="cfgExtId"></span><span></span></div>
      <div class="irow"><span class="iico"></span><span class="ilabel">来源白名单</span><span class="ivalue mono" id="cfgOrigin"></span><span></span></div>
      <p class="snote">把上面这行填进 mcp/config.json 的 allowedOrigins（已预置，一般无需改动）。</p>
    </div>
  </section>

  <footer class="statusbar">
    <span id="statusmsg">就绪</span>
    <span id="selpill" class="selpill" hidden>已选中 0 项</span>
    <span class="flex1"></span>
    <span class="wm">BookmarkPocket</span>
  </footer>
</div>

<!-- 新建书签：整页编辑器覆盖层（照 LinkPocket LinkEditorPage 的字段与流程，去掉书签没有的字段） -->
<div class="overlay" id="editorOverlay" hidden>
  <div class="card editor">
    <div class="overlay-head">
      <span class="chip-icon">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a3 3 0 0 0 4.2 0l2.2-2.2a3 3 0 0 0-4.2-4.2L7.6 4.2M9.4 6.6a3 3 0 0 0-4.2 0L3 8.8a3 3 0 0 0 4.2 4.2l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      <span class="overlay-title" id="edHeadText">新建书签</span>
    </div>
    <label class="field">名称<input id="edTitle" type="text" placeholder="书签名称"></label>
    <label class="field">网址<input id="edUrl" type="text" placeholder="https://…" spellcheck="false"></label>
    <div class="overlay-foot">
      <button id="edCancel" class="tbtn" type="button">取消</button>
      <button id="edSave" class="tbtn primary" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 删除确认（照 LinkPocket ConfirmDialog：Esc=取消、Enter=确定） -->
<div class="overlay" id="confirmOverlay" hidden>
  <div class="card confirm">
    <div class="overlay-head">
      <span class="chip-icon danger">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.3h10.8M6.4 2.6h3.2M4.1 4.3l.6 9a1.2 1.2 0 0 0 1.2 1.1h4.2a1.2 1.2 0 0 0 1.2-1.1l.6-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      <span class="overlay-title" id="cfTitle">删除</span>
    </div>
    <p class="confirm-msg" id="cfMsg"></p>
    <div class="overlay-foot">
      <button id="cfCancel" class="tbtn" type="button">取消</button>
      <button id="cfOk" class="tbtn primary" type="button">确定</button>
    </div>
  </div>
</div>

<div id="ctxmenu" class="ctxmenu" hidden></div>

<div id="toast" class="notice" role="status">
  <span id="toastmsg"></span>
  <button id="toastaction" class="tact" type="button" hidden>撤销</button>
</div>

<script type="module" src="manager.js"></script>
</body>
</html>
